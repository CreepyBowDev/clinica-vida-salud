    <g aria-label="Table medicos"><rect class="box" x="262" y="464" width="200" height="68"/><text class="stereotype" x="362" y="487">«Table»</text><text class="name" x="362" y="512">medicos</text></g>
    <g aria-label="Table horarios_atencion"><rect class="box" x="482" y="464" width="200" height="68"/><text class="stereotype" x="582" y="487">«Table»</text><text class="name" x="582" y="512">horarios_atencion</text></g>
    <g aria-label="Table configuracion_clinica"><rect class="box" x="702" y="464" width="200" height="68"/><text class="stereotype" x="802" y="487">«Table»</text><text class="name" x="802" y="512">configuracion_clinica</text></g>
    <g aria-label="Table citas"><rect class="box" x="922" y="464" width="206" height="68"/><text class="stereotype" x="1022" y="487">«Table»</text><text class="name" x="1022" y="512">citas</text></g>
  </g>
</svg>
