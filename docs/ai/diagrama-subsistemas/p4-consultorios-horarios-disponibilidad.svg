  <g class="persistence"><path d="M142 356 V464"/><path d="M362 356 V464"/><path d="M582 356 V464"/><path d="M802 356 V464"/><path d="M1022 356 V464"/></g>
  <g id="interfaces">
    <g aria-label="Interface ConsultorioEditorPage.jsx"><rect class="box" x="32" y="98" width="220" height="86"/><text class="stereotype" x="142" y="121">«Interface»</text><text class="name" x="142" y="151">ConsultorioEditorPage.jsx</text></g>
    <g aria-label="Interface AsignacionConsultorioPage.jsx"><rect class="box" x="262" y="98" width="200" height="86"/><text class="stereotype" x="362" y="121">«Interface»</text><text class="name" x="362" y="146"><tspan x="362">AsignacionConsultorio</tspan><tspan x="362" dy="18">Page.jsx</tspan></text></g>
    <g aria-label="Interface HorariosMedicoPage.jsx"><rect class="box" x="482" y="98" width="200" height="86"/><text class="stereotype" x="582" y="121">«Interface»</text><text class="name" x="582" y="151">HorariosMedicoPage.jsx</text></g>
    <g aria-label="Interface ConfiguracionCitasPage.jsx"><rect class="box" x="702" y="98" width="200" height="86"/><text class="stereotype" x="802" y="121">«Interface»</text><text class="name" x="802" y="146"><tspan x="802">ConfiguracionCitas</tspan><tspan x="802" dy="18">Page.jsx</tspan></text></g>
    <g aria-label="Interface DisponibilidadTurnos.jsx"><rect class="box" x="922" y="98" width="206" height="86"/><text class="stereotype" x="1022" y="121">«Interface»</text><text class="name" x="1022" y="151">DisponibilidadTurnos.jsx</text></g>
  </g>
  <g id="classes">
