    <g aria-label="Table versiones_consulta"><rect class="box" x="445" y="400" width="210" height="64"/><text class="stereotype" x="550" y="423">«Table»</text><text class="name" x="550" y="448">versiones_consulta</text></g>
    <g aria-label="Table versiones_antecedente"><rect class="box" x="750" y="400" width="210" height="64"/><text class="stereotype" x="855" y="423">«Table»</text><text class="name" x="855" y="448">versiones_antecedente</text></g>
