    <g aria-label="Interface BitacoraDetailPage.jsx"><rect class="box" x="410" y="88" width="220" height="76"/><text class="stereotype" x="520" y="111">«Interface»</text><text class="name" x="520" y="141">BitacoraDetailPage.jsx</text></g>
  </g>
  <g id="classes">
