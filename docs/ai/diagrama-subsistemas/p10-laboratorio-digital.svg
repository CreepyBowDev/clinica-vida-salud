<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
  <title id="title">P10. Laboratorio digital</title>
  <desc id="desc">SolicitarEstudioPage.jsx utiliza SolicitudLaboratorioService.php; GestionDocumentoLaboratorio.jsx utiliza DocumentoLaboratorioService.php; GestionRevisionResultado.jsx utiliza RevisionResultadoService.php; LaboratorioPage.jsx y DescargarResultado.jsx utilizan ResultadoLaboratorioService.php. Cada línea resume capas HTTP existentes. Se seleccionan dependencias a solicitudes_laboratorio, documentos_laboratorio, revisiones_resultado y versiones_resultado mediante repositorios reales. Carga también crea versiones y actualiza solicitudes; revisión actualiza publicación; lectura combina las cuatro tablas. Los bytes se guardan fuera de PostgreSQL mediante ArchivoLaboratorio y se entregan por endpoint protegido. Las gestiones y la descarga se integran en SolicitudLaboratorioPage.jsx, omitida del dibujo.</desc>
  <defs>
    <marker id="dependency" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#384238" stroke-width="1.1"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #233123; text-anchor: middle; }
      .box { fill: #e2f0d9; stroke: #6c9652; stroke-width: 1; }
      .stereotype { font-size: 13px; }
      .name { font-size: 13px; font-weight: 600; }
      .communication { fill: none; stroke: #384238; stroke-width: 1.1; stroke-linejoin: round; }
      .persistence { fill: none; stroke: #384238; stroke-width: 1.05; stroke-dasharray: 5 4; marker-end: url(#dependency); }
    </style>
  </defs>
  <rect width="1160" height="500" fill="#ffffff"/>
