  <path d="M370 48 H1148 V488 H12 V48 Z" fill="#ffffff" stroke="#6c9652" stroke-width="1"/>
  <text x="185" y="35" font-size="16" font-weight="700">P10. LABORATORIO DIGITAL</text>
