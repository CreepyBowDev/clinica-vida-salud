  </g>
  <g id="classes">
    <g aria-label="Class ReporteService.php"><rect class="box" x="260" y="234" width="240" height="76"/><text class="stereotype" x="380" y="257">«Class»</text><text class="name" x="380" y="287">ReporteService.php</text></g>
  </g>
  <g id="tables">
