<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="574" viewBox="0 0 1160 574" role="img" aria-labelledby="title desc">
  <title id="title">P4. Consultorios, horarios y disponibilidad</title>
  <desc id="desc">Cinco interfaces React y cinco servicios Laravel con dependencias representativas hacia cinco tablas existentes. ConsultorioEditorPage utiliza ConsultorioService y consultorios; AsignacionConsultorioPage utiliza AsignacionConsultorioService y medicos; HorariosMedicoPage utiliza HorarioService y horarios_atencion; ConfiguracionCitasPage utiliza ConfiguracionCitasService y configuracion_clinica; DisponibilidadTurnos utiliza DisponibilidadService y consulta citas para calcular ocupación, sin registrar reservas. Las líneas resumen HTTP y persistencia; las dependencias compartidas omitidas se explican en el documento.</desc>
  <defs>
    <marker id="dependency" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#384238" stroke-width="1.1"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #233123; text-anchor: middle; }
      .box { fill: #e2f0d9; stroke: #6c9652; stroke-width: 1; }
      .stereotype { font-size: 13px; }
      .name { font-size: 13px; font-weight: 600; }
      .communication { fill: none; stroke: #384238; stroke-width: 1.1; stroke-linejoin: round; }
      .persistence { fill: none; stroke: #384238; stroke-width: 1.05; stroke-dasharray: 5 4; marker-end: url(#dependency); }
    </style>
  </defs>
  <rect width="1160" height="574" fill="#ffffff"/>
  <path d="M12 48 V12 H562 L580 30 V48 Z" fill="#a9d18e" stroke="#6c9652" stroke-width="1"/>
  <path d="M580 48 H1148 V562 H12 V48 Z" fill="#ffffff" stroke="#6c9652" stroke-width="1"/>
  <text x="290" y="35" font-size="16" font-weight="700">P4. CONSULTORIOS, HORARIOS Y DISPONIBILIDAD</text>
