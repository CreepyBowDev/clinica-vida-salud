<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="574" viewBox="0 0 1160 574" role="img" aria-labelledby="title desc">
  <title id="title">P3. Médicos y especialidades</title>
  <desc id="desc">Cinco interfaces React, dos servicios Laravel y tres tablas existentes. DoctorsPage, DoctorEditorPage y DoctorSpecialtiesPage utilizan MedicoService; SpecialtiesPage y SpecialtyEditorPage utilizan EspecialidadService. MedicoService depende de medicos y medico_especialidad; EspecialidadService depende de especialidades. Las conexiones resumen servicios frontend, HTTP, controladores, repositorios y Eloquent; se omiten dependencias compartidas descritas en el documento.</desc>
  <defs>
    <marker id="dependency" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#384238" stroke-width="1.1"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #233123; text-anchor: middle; }
      .box { fill: #e2f0d9; stroke: #6c9652; stroke-width: 1; }
      .stereotype { font-size: 13px; }
      .name { font-size: 13px; font-weight: 600; }
      .communication { fill: none; stroke: #384238; stroke-width: 1.1; stroke-linejoin: round; }
      .persistence { fill: none; stroke: #384238; stroke-width: 1.05; stroke-dasharray: 5 4; marker-end: url(#dependency); }
    </style>
  </defs>
  <rect width="1160" height="574" fill="#ffffff"/>
  <path d="M12 48 V12 H432 L450 30 V48 Z" fill="#a9d18e" stroke="#6c9652" stroke-width="1"/>
  <path d="M450 48 H1148 V562 H12 V48 Z" fill="#ffffff" stroke="#6c9652" stroke-width="1"/>
  <text x="225" y="35" font-size="16" font-weight="700">P3. MÉDICOS Y ESPECIALIDADES</text>
  <g class="communication">
    <path d="M142 184 V222 H362 V270"/><path d="M362 184 V222"/><path d="M582 184 V222 H362"/>
    <path d="M802 184 V222 H912 V270"/><path d="M1022 184 V222 H912"/>
  </g>
  <g class="persistence"><path d="M332 356 L202 464"/><path d="M392 356 L522 464"/><path d="M912 356 V464"/></g>
  <g id="interfaces">
    <g aria-label="Interface DoctorsPage.jsx"><rect class="box" x="32" y="98" width="220" height="86"/><text class="stereotype" x="142" y="121">«Interface»</text><text class="name" x="142" y="151">DoctorsPage.jsx</text></g>
    <g aria-label="Interface DoctorEditorPage.jsx"><rect class="box" x="262" y="98" width="200" height="86"/><text class="stereotype" x="362" y="121">«Interface»</text><text class="name" x="362" y="151">DoctorEditorPage.jsx</text></g>
    <g aria-label="Interface DoctorSpecialtiesPage.jsx"><rect class="box" x="482" y="98" width="200" height="86"/><text class="stereotype" x="582" y="121">«Interface»</text><text class="name" x="582" y="151">DoctorSpecialtiesPage.jsx</text></g>
    <g aria-label="Interface SpecialtiesPage.jsx"><rect class="box" x="702" y="98" width="200" height="86"/><text class="stereotype" x="802" y="121">«Interface»</text><text class="name" x="802" y="151">SpecialtiesPage.jsx</text></g>
    <g aria-label="Interface SpecialtyEditorPage.jsx"><rect class="box" x="922" y="98" width="206" height="86"/><text class="stereotype" x="1022" y="121">«Interface»</text><text class="name" x="1022" y="151">SpecialtyEditorPage.jsx</text></g>
  </g>
  <g id="classes">
    <g aria-label="Class MedicoService.php"><rect class="box" x="222" y="270" width="280" height="86"/><text class="stereotype" x="362" y="293">«Class»</text><text class="name" x="362" y="323">MedicoService.php</text></g>
    <g aria-label="Class EspecialidadService.php"><rect class="box" x="772" y="270" width="280" height="86"/><text class="stereotype" x="912" y="293">«Class»</text><text class="name" x="912" y="323">EspecialidadService.php</text></g>
  </g>
  <g id="tables">
    <g aria-label="Table medicos"><rect class="box" x="92" y="464" width="220" height="68"/><text class="stereotype" x="202" y="487">«Table»</text><text class="name" x="202" y="512">medicos</text></g>
    <g aria-label="Table medico_especialidad"><rect class="box" x="412" y="464" width="220" height="68"/><text class="stereotype" x="522" y="487">«Table»</text><text class="name" x="522" y="512">medico_especialidad</text></g>
    <g aria-label="Table especialidades"><rect class="box" x="802" y="464" width="220" height="68"/><text class="stereotype" x="912" y="487">«Table»</text><text class="name" x="912" y="512">especialidades</text></g>
