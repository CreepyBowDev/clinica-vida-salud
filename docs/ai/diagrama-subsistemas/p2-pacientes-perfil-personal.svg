    <g aria-label="Table verificaciones_correo"><rect class="box" x="1002" y="464" width="126" height="68"/><text class="stereotype" x="1065" y="484">«Table»</text><text class="name" x="1065" y="505"><tspan x="1065">verificaciones_</tspan><tspan x="1065" dy="17">correo</tspan></text></g>
  </g>
</svg>
