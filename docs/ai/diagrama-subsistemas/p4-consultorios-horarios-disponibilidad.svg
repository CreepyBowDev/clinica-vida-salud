    <g aria-label="Class AsignacionConsultorioService.php"><rect class="box" x="262" y="270" width="200" height="86"/><text class="stereotype" x="362" y="293">«Class»</text><text class="name" x="362" y="318"><tspan x="362">AsignacionConsultorio</tspan><tspan x="362" dy="18">Service.php</tspan></text></g>
    <g aria-label="Class HorarioService.php"><rect class="box" x="482" y="270" width="200" height="86"/><text class="stereotype" x="582" y="293">«Class»</text><text class="name" x="582" y="323">HorarioService.php</text></g>
    <g aria-label="Class ConfiguracionCitasService.php"><rect class="box" x="702" y="270" width="200" height="86"/><text class="stereotype" x="802" y="293">«Class»</text><text class="name" x="802" y="318"><tspan x="802">ConfiguracionCitas</tspan><tspan x="802" dy="18">Service.php</tspan></text></g>
