    <g aria-label="Interface ConsultaDetallePage.jsx"><rect class="box" x="270" y="94" width="210" height="80"/><text class="stereotype" x="375" y="118">«Interface»</text><text class="name" x="375" y="148">ConsultaDetallePage.jsx</text></g>
    <g aria-label="Interface VersionesClinicasPage.jsx"><rect class="box" x="500" y="94" width="210" height="80"/><text class="stereotype" x="605" y="118">«Interface»</text><text class="name" x="605" y="148">VersionesClinicasPage.jsx</text></g>
    <g aria-label="Interface ConsultaEditorPage.jsx"><rect class="box" x="750" y="94" width="210" height="80"/><text class="stereotype" x="855" y="118">«Interface»</text><text class="name" x="855" y="148">ConsultaEditorPage.jsx</text></g>
  </g>
  <g id="classes">
    <g aria-label="Class HistoriaClinicaService.php"><rect class="box" x="155" y="245" width="440" height="80"/><text class="stereotype" x="375" y="269">«Class»</text><text class="name" x="375" y="299">HistoriaClinicaService.php</text></g>
    <g aria-label="Class ConsultaMedicaService.php"><rect class="box" x="750" y="245" width="210" height="80"/><text class="stereotype" x="855" y="269">«Class»</text><text class="name" x="855" y="299">ConsultaMedicaService.php</text></g>
  </g>
  <g id="tables">
