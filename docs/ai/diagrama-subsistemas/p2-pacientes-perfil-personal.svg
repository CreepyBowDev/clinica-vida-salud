    <g aria-label="Interface EditPatientPage.jsx"><rect class="box" x="262" y="98" width="200" height="86"/><text class="stereotype" x="362" y="121">«Interface»</text><text class="name" x="362" y="151">EditPatientPage.jsx</text></g>
    <g aria-label="Interface ActivationCodePage.jsx"><rect class="box" x="482" y="98" width="200" height="86"/><text class="stereotype" x="582" y="121">«Interface»</text><text class="name" x="582" y="151">ActivationCodePage.jsx</text></g>
    <g aria-label="Interface MyProfilePage.jsx"><rect class="box" x="702" y="98" width="200" height="86"/><text class="stereotype" x="802" y="121">«Interface»</text><text class="name" x="802" y="151">MyProfilePage.jsx</text></g>
    <g aria-label="Interface ChangeEmailPage.jsx"><rect class="box" x="922" y="98" width="206" height="86"/><text class="stereotype" x="1022" y="121">«Interface»</text><text class="name" x="1022" y="151">ChangeEmailPage.jsx</text></g>
  </g>
