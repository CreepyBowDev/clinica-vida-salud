<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="574" viewBox="0 0 1160 574" role="img" aria-labelledby="title desc">
  <title id="title">P2. Pacientes y perfil personal</title>
  <desc id="desc">Cinco interfaces React, cuatro servicios Laravel y seis tablas existentes. NewPatientPage y EditPatientPage comparten PacienteService; ActivationCodePage utiliza CodigoActivacionService; MyProfilePage utiliza MiPerfilService; ChangeEmailPage utiliza CambioCorreoService. Las dependencias seleccionadas son PacienteService a pacientes, CodigoActivacionService a codigos_activacion_paciente, MiPerfilService a contactos_emergencia y preferencias_paciente, y CambioCorreoService a usuarios y verificaciones_correo. Se resumen las capas HTTP, repositorios y Eloquent y se omiten dependencias compartidas descritas en el documento.</desc>
  <defs>
    <marker id="dependency" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#384238" stroke-width="1.1"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #233123; text-anchor: middle; }
      .box { fill: #e2f0d9; stroke: #6c9652; stroke-width: 1; }
      .stereotype { font-size: 13px; }
      .name { font-size: 13px; font-weight: 600; }
      .communication { fill: none; stroke: #384238; stroke-width: 1.1; stroke-linejoin: round; }
      .persistence { fill: none; stroke: #384238; stroke-width: 1.05; stroke-dasharray: 5 4; marker-end: url(#dependency); }
    </style>
  </defs>
  <rect width="1160" height="574" fill="#ffffff"/>
  <path d="M12 48 V12 H432 L450 30 V48 Z" fill="#a9d18e" stroke="#6c9652" stroke-width="1"/>
  <path d="M450 48 H1148 V562 H12 V48 Z" fill="#ffffff" stroke="#6c9652" stroke-width="1"/>
  <text x="225" y="35" font-size="16" font-weight="700">P2. PACIENTES Y PERFIL PERSONAL</text>
  <g class="communication">
    <path d="M142 184 V222 H252 V270"/><path d="M362 184 V222 H252"/>
    <path d="M582 184 V270"/><path d="M802 184 V270"/><path d="M1022 184 V270"/>
  </g>
  <g class="persistence">
    <path d="M252 356 L147 464"/><path d="M582 356 L393 464"/>
    <path d="M782 356 L614 464"/><path d="M822 356 L800 464"/>
    <path d="M1002 356 L941 464"/><path d="M1042 356 L1065 464"/>
  </g>
  <g id="interfaces">
